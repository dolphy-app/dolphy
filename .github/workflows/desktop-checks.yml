name: Desktop checks

# Packaged smoke and desktop e2e. Kept out of ci.yml so ordinary PRs into develop stay fast.
# No `paths` filter on purpose: a release PR into main must always get both checks.
on:
  push:
    branches: [feature/extension-foundation-1d] # TEMP verification
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-packaged:
    name: Packaged smoke (${{ matrix.os }})
    # the nightly run only covers e2e
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Allow Chromium sandbox (Linux)
        if: runner.os == 'Linux'
        # Ubuntu 24.04 blocks unprivileged user namespaces; the sandbox stays on, the app is not run with --no-sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke (packaged, macOS)
        if: runner.os == 'macOS'
        run: pnpm smoke:packaged

      - name: Smoke (packaged, Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm smoke:packaged

  e2e:
    name: Desktop e2e (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Allow Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: E2E
        run: xvfb-run --auto-servernum pnpm -F @dolphy/desktop e2e
