packages:
  - apps/*
  - packages/*

# For electron-builder
# https://github.com/electron-userland/electron-builder/issues/6289#issuecomment-1042620422
shamefullyHoist: true

# pnpm ≥ 10 fails on dependency build scripts that are not decided explicitly.
allowBuilds:
  # optional dependency of sass for its --watch CLI; Vite uses the compile API
  '@parcel/watcher': false
  electron-winstaller: false
  esbuild: false
  vue-demi: false
